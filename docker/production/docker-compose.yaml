services:
  app:
    build:
      context: ../..                              # Points up to project root
      dockerfile: docker/production/Dockerfile    # Relative to context
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ../../.env                               # Points up to root .env file
    init: true                                  # ✅ Run migrations on startup  
    stop_grace_period: 30s                      # ✅ Wait 30 seconds before forcefully killing the container