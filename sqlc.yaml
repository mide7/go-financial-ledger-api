version: "2"
sql:
    - schema: "internal/platform/database/postgres/migrations"
      queries: "internal/platform/database/postgres/query"
      engine: "postgresql"
      gen:
          go:
            package: "sqlc"
            out: "internal/platform/database/postgres/sqlc"
            sql_package: "pgx/v5"     # Use pgx for better performance and features with PostgreSQL
            emit_json_tags: true
            emit_empty_slices: true
            emit_interface: true
            overrides:
              # Non-nullable UUIDs
              - db_type: "uuid"
                nullable: false
                go_type: "github.com/google/uuid.UUID"
              # Nullable UUIDs -> uuid.NullUUID
              - db_type: "uuid"
                nullable: true
                go_type:
                  import: "github.com/google/uuid"
                  type: "NullUUID"
                  pointer: false
              - db_type: "timestamptz"
                go_type: "time.Time"
              - db_type: "timestamp"
                go_type: "time.Time"